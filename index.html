<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IRIS: Indian Resistance Interpretation Surveillance</title>
    <meta name="description" content="A centralized reporting and analysis portal for tracking antimicrobial resistance across clinical and environmental sectors in India." />
    <meta property="og:title" content="IRIS: Indian Resistance Interpretation Surveillance" />
    <meta property="og:description" content="A centralized reporting and analysis portal for tracking antimicrobial resistance across clinical and environmental sectors in India." />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('iris_theme_preference');
          var theme = saved === 'dark' || saved === 'light'
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
